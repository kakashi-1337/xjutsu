{% extends 'hunter/base.html' %}

{% block title %}Login - XJutsu v5{% endblock %}

{% block auth_content %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="card rounded-2xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold gradient-text">
                <i class="fas fa-crosshairs mr-2"></i>XJutsu v5
            </h1>
            <p class="text-gray-500 mt-2">XSS Hunter Framework</p>
        </div>
        
        {% if form.errors %}
        <div class="bg-red-500/20 border border-red-500 rounded-lg p-4 mb-6">
            <p class="text-red-400">Invalid username or password.</p>
        </div>
        {% endif %}
        
        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Username</label>
                <input type="text" name="username" required
                    class="w-full px-4 py-3 bg-dark-900 border border-gray-700 rounded-lg focus:outline-none focus:border-primary transition"
                    placeholder="Enter username">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Password</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-3 bg-dark-900 border border-gray-700 rounded-lg focus:outline-none focus:border-primary transition"
                    placeholder="Enter password">
            </div>
            
            <button type="submit" class="btn-primary w-full py-3 rounded-lg font-semibold text-white transition">
                <i class="fas fa-sign-in-alt mr-2"></i>Login
            </button>
        </form>
        
        <div class="mt-8 text-center text-gray-500 text-sm">
            <p>Bug Bounty XSS Testing Tool</p>
        </div>
    </div>
</div>
{% endblock %}
