version: '3.8'

services:
  xjutsu:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=change-this-to-a-secure-key
      - DEBUG=False
      - ALLOWED_HOSTS=*
    volumes:
      - ./xjutsu.db:/app/xjutsu.db
      - ./media:/app/media
    restart: unless-stopped

